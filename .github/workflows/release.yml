name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; skipping release."
            exit 0
          fi
          if [ "$EVENT_NAME" = 'push' ] && git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            old_version="$(git show "$BEFORE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
            if [ "$old_version" = "$version" ]; then
              echo 'Version unchanged; skipping release.'
              exit 0
            fi
          fi
          echo 'release=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.release == 'true'
        with:
          version: '11.28.5'
      - name: Install locked dependencies
        if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify plugin
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          node --check index.js
          node --check client.js
          node --test --test-isolation=none test/*.test.*
      - name: Pack and verify contents
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          tar -tzf dist/*.tgz > dist/contents.txt
          node -e "const fs=require('node:fs'); const entries=fs.readFileSync('dist/contents.txt','utf8').split(/\r?\n/); for (const f of ['package.json','index.js','client.js','cordis.patch.yml','README.md','icon.svg','locale/zh.json','locale/en.json']) { if (!entries.includes('package/'+f)) { console.error('Missing '+f); process.exit(1); } }"
          (cd dist && sha256sum -- *.tgz > SHA256SUMS.txt)
      - name: Publish tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Install: github:x-mug/dsh-session-header#$RELEASE_TAG"
